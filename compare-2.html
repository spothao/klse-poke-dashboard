:root { color-scheme: only light; }
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  color: #000;
}
body {
  font-family: Arial, Helvetica, "Noto Sans", "DejaVu Sans", sans-serif;
  font-size: clamp(16px, 4.3vmin, 42px);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.page {
  width: 100vw;
  height: 100vh;

  max-height: 100vh;

  flex-direction: column;

}

.compare {

  border-collapse: collapse;
  table-layout: fixed;
  margin: 0 0 0.3em;
  flex: 0 0 auto;
}
.compare th, .compare td {
  border: 2px solid #000;
  padding: 0.22em 0.25em;
  text-align: right;
  font-weight: 700;
  vertical-align: middle;
}
.compare th:first-child, .compare td:first-child {
  text-align: left;
  font-weight: 700;
  width: 28%;
}
.compare thead th { text-align: center; }
.ahead {
  border: 3px solid #000;
  font-weight: 700;
  text-align: center;
  padding: 0.3em 0.35em;

}
.jump {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.28em;
  margin: 0 0 0.3em;
}
.jump a, nav.bar a, nav.bar span {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: max(48px, 11vmin);
  border: 3px solid #000;
  color: #000;
  text-decoration: none;
  font-weight: 700;
  text-align: center;
  padding: 0.15em 0.3em;
  background: #fff;
}
nav.bar {
  display: flex;
  gap: 0.28em;
  margin-top: auto;
  padding-top: 0.25em;
}
nav.bar a, nav.bar span { flex: 1; }
nav.bar .home { font-weight: 800; }
table.grid {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 1em;
}
table.grid th, table.grid td {
  border: 2px solid #000;
  padding: 0.12em 0.1em;
  text-align: left;
  vertical-align: middle;
  overflow: hidden;
  white-space: nowrap;
}
table.grid th { font-weight: 700; }
table.grid .num { text-align: right; }
table.grid .c-code { width: 14%; }
table.grid .c-name { width: 24%; }
table.grid .c-shs { width: 11%; }
table.grid .c-cost { width: 17%; }
table.grid .c-close { width: 16%; }
table.grid .c-pnl { width: 18%; }
table.grid.watch .c-code { width: 18%; }
table.grid.watch .c-name { width: 32%; }
table.grid.watch .c-close { width: 22%; }
table.grid.watch .c-held { width: 28%; }
.note, .missing {
  font-size: 1em;
  margin: 0.2em 0 0;
  flex: 0 0 auto;
}
.missing { font-weight: 700; }
.section-title {
  font-size: 1.05em;
  font-weight: 700;
  margin: 0 0 0.2em;
  padding: 0 0 0.08em;
  border-bottom: 2px solid #000;
}
.trades {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 0.35em;
  table-layout: fixed;
}
.trades th, .trades td {
  border: 2px solid #000;
  padding: 0.12em 0.12em;
  text-align: left;
  vertical-align: middle;
  overflow: hidden;
  white-space: nowrap;
}
.trades .num { text-align: right; }
.summary p {
  margin: 0 0 0.3em;
  line-height: 1.25;
}
.compare td.wrap, .compare th.wrap { white-space: normal; }
