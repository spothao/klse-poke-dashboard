name: Generate screensaver

on:
  push:
    branches: [main]
    paths:
      - "generate_screensaver.py"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-screensaver
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screensaver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow

      - name: Generate screensaver.png
        run: python3 generate_screensaver.py

      - name: Commit screensaver.png if it changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screensaver.png
          if git diff --cached --quiet; then
            echo "screensaver.png unchanged"
          else
            git commit -m "Update screensaver.png [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
