name: Publish screensaver to Pages

# Copies screensaver.png (and a one-image index page) to GitHub Pages. It never
# renders and never commits: the image is rendered from the MoneyLens database by
# spothao/moneylens's "Paper ledgers" workflow, which pushes it to main. The old
# workflow re-rendered from stale data/ files on every push and could overwrite
# the database render; that is gone.
#
# Both URLs keep working:
#   https://raw.githubusercontent.com/spothao/klse-poke-dashboard/main/screensaver.png
#   https://spothao.github.io/klse-poke-dashboard/screensaver.png

on:
  push:
    branches: [main]
    paths: [screensaver.png]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage screensaver.png
        run: |
          mkdir site
          cp screensaver.png site/
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta http-equiv="refresh" content="900">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>KLSE paper trading</title>
          <style>html,body{margin:0;background:#fff}img{display:block;width:100%;height:auto}</style>
          </head><body><img src="screensaver.png" alt="Paper-trading screensaver"></body></html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
